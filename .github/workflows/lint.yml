name: Lint

on:
  push:
    branches:
      - main
    paths:
      - "start.sh"
      - "docker-compose.yml"
      - ".yamllint.yml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "start.sh"
      - "docker-compose.yml"
      - ".yamllint.yml"
      - ".github/workflows/lint.yml"

env:
  SHFMT_VERSION: "3.13.1"

jobs:
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck start.sh

      - name: Install shfmt
        run: |
          curl -sSL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: Check shell script formatting
        run: shfmt -i 2 -ci -d start.sh

  compose-lint:
    runs-on: ubuntu-latest
    env:
      LABEL_STUDIO_USERNAME: "ci@example.com"
      LABEL_STUDIO_PASSWORD: "ci-dummy-password"
      LABEL_STUDIO_LEGACY_TOKEN: "ci-dummy-token"
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yml docker-compose.yml
